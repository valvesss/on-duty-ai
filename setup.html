<html lang="en">

<meta charset="utf-8">

<style>
  :root { --c1:#0f766e; --c2:#2563eb; --font:"Avenir Next","SF Pro Rounded",ui-rounded,system-ui,sans-serif; }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; font-family:var(--font); color:#fff; background:linear-gradient(135deg,var(--c1),var(--c2)); transition:background 1s; overflow-x:hidden }
  body::before { content:""; position:fixed; inset:-50%; opacity:.12; pointer-events:none;
                 background:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 24px); animation:drift 24s linear infinite }
  @keyframes drift { to { transform:translate(48px,48px) } }
  #app { position:relative; min-height:100%; max-width:980px; margin:0 auto; padding:22px 20px 28px; display:flex; flex-direction:column }
  .top { display:flex; align-items:center; gap:14px }
  .top img { width:34px; height:34px }
  .top b { font-size:18px; letter-spacing:-.02em }
  .dots { display:flex; gap:8px; margin-left:auto }
  .dots button { width:12px; height:12px; padding:0; border-radius:50%; border:0; background:#fff5; cursor:pointer; transition:.3s }
  .dots button.on { background:#fff; width:34px; border-radius:6px }
  .dots button.done { background:#fffc }
  .lang { background:#0003; color:#fff; border:0; border-radius:99px; padding:6px 12px; font:700 13px var(--font); cursor:pointer }
  .stage { flex:1; display:grid; grid-template-columns:minmax(200px,300px) 1fr; gap:40px; align-items:center; padding:20px 0 }
  @media (max-width: 760px) { .stage { grid-template-columns:1fr; gap:10px } .mascot { width:150px !important } }
  .mascot { width:280px; filter:drop-shadow(0 14px 24px #0005); justify-self:center; transition:transform .5s }
  .mascot.bounce { animation:bounce .6s }
  @keyframes bounce { 30% { transform:translateY(-18px) rotate(-3deg) } 60% { transform:translateY(0) } }
  .pupil { transition:transform .12s }
  .brow { transform-box:fill-box; transform-origin:center; transition:transform .35s }
  .lid { transform-box:fill-box; transform-origin:top; transform:scaleY(0) }
  .blink .lid { animation:blink 4s infinite }
  @keyframes blink { 0%,94%,100% { transform:scaleY(0) } 97% { transform:scaleY(1) } }
  .panel { animation:in .45s cubic-bezier(.2,.9,.3,1) }
  @keyframes in { from { opacity:0; transform:translateY(22px) } }
  h1 { font-size:clamp(32px,5.2vw,56px); line-height:1.04; margin:0 0 14px; letter-spacing:-.035em; font-weight:800 }
  p.sub { font-size:19px; line-height:1.45; margin:0 0 26px; opacity:.92; max-width:560px }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center }
  input[type=text], input[type=time], select {
    font:700 28px var(--font); color:#17171a; background:#fff; border:0; border-radius:18px; padding:16px 20px; outline:none; width:100%; max-width:480px;
    box-shadow:0 10px 30px #0004 }
  input[type=time] { font-size:22px; width:auto; padding:12px 16px }
  select { font-size:20px; appearance:none }
  .btn { font:800 18px var(--font); border:0; border-radius:99px; padding:15px 28px; cursor:pointer; transition:transform .12s, box-shadow .12s }
  .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px #0004 }
  .btn.main { background:#fff; color:#17171a }
  .btn.ghost { background:#0003; color:#fff }
  .btn[disabled] { opacity:.4; pointer-events:none }
  .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; max-width:640px }
  @media (max-width: 560px) { .cards { grid-template-columns:1fr } }
  .card { text-align:left; background:#ffffff26; border:3px solid transparent; border-radius:20px; padding:16px 18px; color:#fff; cursor:pointer; font:inherit; transition:.2s; backdrop-filter:blur(6px) }
  .card:hover { transform:translateY(-3px); background:#ffffff38 }
  .card.on { background:#fff; color:#17171a; border-color:#fff; box-shadow:0 14px 34px #0005 }
  .card .em { font-size:30px }
  .card b { display:block; font-size:20px; margin:4px 0 2px }
  .card small { display:block; font-size:14px; opacity:.85; line-height:1.35 }
  .card q { display:block; margin-top:8px; font-style:normal; font-weight:700; font-size:14px; opacity:.95 }
  .card .play { float:right; background:#0002; border-radius:99px; padding:3px 9px; font-size:13px }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px }
  .chip { border:0; border-radius:99px; padding:10px 16px; font:800 16px var(--font); background:#ffffff30; color:#fff; cursor:pointer; transition:.2s }
  .chip.on { background:#fff; color:#17171a }
  .field { margin-bottom:16px }
  .field label { display:block; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.08em; opacity:.85; margin-bottom:8px }
  .switch { display:flex; align-items:center; gap:12px; font-weight:700; font-size:18px; cursor:pointer; margin:0 0 14px; user-select:none }
  .switch i { width:52px; height:30px; border-radius:15px; background:#fff4; position:relative; transition:.25s; flex:none }
  .switch i::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:.25s }
  .switch.on i { background:#22c55e } .switch.on i::after { left:25px }
  .summary { background:#0003; border-radius:16px; padding:12px 16px; font-size:16px; max-width:560px; margin-top:6px }
  .cam { position:relative; width:100%; max-width:340px; border-radius:20px; overflow:hidden; box-shadow:0 18px 40px #0006; background:#000; aspect-ratio:4/3 }
  .cam img { width:100%; height:100%; object-fit:cover; display:block }
  .cam .off { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px; font-weight:700; background:#000a }
  .checks { display:grid; gap:10px; margin-top:16px; max-width:440px }
  .check { display:flex; align-items:center; gap:12px; background:#0003; border-radius:14px; padding:12px 16px; font-weight:700; font-size:17px }
  .check .tick { width:28px; height:28px; border-radius:50%; background:#fff3; display:grid; place-items:center; flex:none; transition:.3s }
  .check.ok .tick { background:#22c55e }
  .check small { display:block; font-weight:600; opacity:.8; font-size:13px }
  .nav { display:flex; gap:12px; margin-top:28px; align-items:center }
  .hintkey { opacity:.7; font-size:13px; margin-left:auto }
  .prompt { background:#0004; border-radius:16px; padding:14px 16px; font:600 15px/1.45 ui-monospace,"SF Mono",monospace; max-width:560px; margin:12px 0; white-space:pre-wrap }
  .live { background:#fff; color:#17171a; border-radius:20px; padding:14px 20px; font:800 24px/1.2 var(--font); max-width:560px; margin-top:16px; min-height:60px; box-shadow:0 12px 30px #0004 }
  #fx { position:fixed; inset:0; pointer-events:none; z-index:20 }
  .err { background:#7f1d1d; border-radius:12px; padding:10px 14px; margin:10px 0; font-weight:700; display:none }
</style>
</head>

  const q = new URLSearchParams(location.search);
  step = q.has('calibrate') ? STEPS.indexOf('calibrate') : q.has('step') ? +q.get('step') : cfg.onboarded && q.has('edit') ? 1 : 0; maxStep = cfg.onboarded ? STEPS.length - 1 : 0; render();
})();
</script>
