<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>on-duty</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2170"/>
      <stop offset="1" stop-color="#0E0B24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#6D5BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6D5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF4D6D"/>
    </linearGradient>
    <clipPath id="eye">
      <path d="M84 266 C 150 150, 362 150, 428 266 C 362 382, 150 382, 84 266 Z"/>
    </clipPath>
  </defs>

  <!-- app-icon squircle -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#glow)"/>

  <!-- the eye -->
  <path d="M84 266 C 150 150, 362 150, 428 266 C 362 382, 150 382, 84 266 Z" fill="#F4F2FF"/>
  <g clip-path="url(#eye)">
    <circle cx="256" cy="266" r="92" fill="#1B1546"/>
    <circle cx="256" cy="266" r="92" fill="none" stroke="#6D5BFF" stroke-width="10" opacity="0.9"/>
    <!-- pupil = a phone -->
    <rect x="222" y="206" width="68" height="120" rx="16" fill="url(#phone)"/>
    <rect x="231" y="221" width="50" height="84" rx="6" fill="#1B1546" opacity="0.92"/>
    <rect x="248" y="212" width="16" height="4" rx="2" fill="#1B1546" opacity="0.6"/>
    <!-- doomscroll lines on the screen -->
    <rect x="239" y="232" width="34" height="6" rx="3" fill="#FF8A5B" opacity="0.9"/>
    <rect x="239" y="246" width="24" height="6" rx="3" fill="#FF8A5B" opacity="0.6"/>
    <rect x="239" y="260" width="30" height="6" rx="3" fill="#FF8A5B" opacity="0.4"/>
    <rect x="239" y="274" width="20" height="6" rx="3" fill="#FF8A5B" opacity="0.25"/>
    <!-- catchlight -->
    <circle cx="300" cy="226" r="13" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <path d="M84 266 C 150 150, 362 150, 428 266 C 362 382, 150 382, 84 266 Z" fill="none" stroke="#0E0B24" stroke-width="6" opacity="0.35"/>

  <!-- "on duty" camera light -->
  <circle cx="404" cy="108" r="26" fill="#2EE59D" opacity="0.25"/>
  <circle cx="404" cy="108" r="15" fill="#2EE59D"/>
</svg>
