<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>on-duty</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#f4f3ef; --card:#fff; --fg:#1b1b1a; --mute:#77756f; --line:#e4e2dc;
          --ok:#1f8a4c; --warn:#c77b0a; --bad:#d23a2f; --acc:#3b6fd4;
          --c1:#0f766e; --c2:#22c55e; --font:"Avenir Next","SF Pro Rounded",ui-rounded,system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e0d; --card:#1a1a18; --fg:#ecebe6; --mute:#9a988f; --line:#2c2b28; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 var(--font); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:99px;
           padding:7px 14px; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-1px); box-shadow:0 4px 14px #0002 }
  main { max-width:1080px; margin:0 auto; padding:18px 16px 60px; display:grid; gap:16px; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
  header .logo { width:34px; height:34px }
  header h1 { margin:0; font-size:20px; letter-spacing:-.02em }
  .pill { font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px; color:#fff; background:var(--mute); text-transform:uppercase; letter-spacing:.04em }
  header .sp { flex:1 }
  .gear { text-decoration:none; color:var(--fg); border:1px solid var(--line); background:var(--card); border-radius:99px; padding:6px 12px; font-size:17px; line-height:1.2 }
  .menuwrap { position:relative } .menu { position:absolute; right:0; top:110%; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px; display:none; z-index:30; box-shadow:0 10px 30px #0004; min-width:170px }
  .menu.on { display:grid; gap:4px } .menu button { border:0; text-align:left; border-radius:10px }
  .polaroid.sleepy img { opacity:0 } .polaroid .zz { position:absolute; left:12px; right:12px; top:12px; aspect-ratio:4/3; display:none; place-items:center; font-size:72px; background:#16162a; border-radius:2px }
  .polaroid.sleepy .zz { display:grid }
  .mascot.asleep .lid { transform:scaleY(1) !important; animation:none !important }
  #photo { background:linear-gradient(135deg,var(--c1),var(--c2)); color:#fff; border:0; font-weight:700 }
  #photo.hot { animation:pulse 1s infinite }
  @keyframes pulse { 50% { transform:scale(1.08); box-shadow:0 0 0 8px #ff3b3033 } }

  /* ---------- stage ---------- */
  .stage { position:relative; overflow:hidden; border-radius:26px; color:#fff; min-height:520px; padding:28px;
           display:grid; grid-template-columns: minmax(260px,420px) 1fr; gap:28px; align-items:center;
           background:linear-gradient(135deg,var(--c1),var(--c2)); transition:background .8s; isolation:isolate;
           box-shadow:0 20px 60px -20px var(--c1); }
  .stage::before { content:""; position:absolute; inset:-50%; z-index:-1; opacity:.16;
           background:repeating-linear-gradient(45deg,#fff 0 2px,transparent 2px 22px); animation:drift 20s linear infinite }
  .stage::after { content:""; position:absolute; inset:0; z-index:-1;
           background:radial-gradient(60% 70% at 75% 20%,#ffffff40,transparent 70%) }
  @keyframes drift { to { transform:translate(44px,44px) } }
  .stage.shake { animation:shake .5s infinite }
  .stage.shake5 { animation:shake .22s infinite }
  @keyframes shake { 0%,100% { transform:translate(0) } 25% { transform:translate(-3px,2px) } 50% { transform:translate(3px,-2px) } 75% { transform:translate(-2px,-3px) } }
  @media (max-width: 820px) { .stage { grid-template-columns:1fr; padding:18px } }

  .polaroid { background:#fff; padding:12px 12px 0; border-radius:6px; box-shadow:0 18px 40px #0006, 0 2px 0 #fff8 inset;
              transform:rotate(-2.5deg); transition:transform .5s; position:relative; color:#222; max-width:420px; width:100%; justify-self:center }
  .polaroid:hover { transform:rotate(0) scale(1.02) }
  .polaroid img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#111; border-radius:2px }
  .polaroid .cap { font:700 22px/1 "Marker Felt","Bradley Hand","Segoe Print",cursive; padding:14px 6px 16px; display:flex; justify-content:space-between; gap:8px }
  .polaroid .cap span:last-child { opacity:.55; font-size:17px; align-self:center }
  .stamp { position:absolute; right:-14px; top:20px; transform:rotate(12deg); border:4px solid var(--stampc,#16a34a); color:var(--stampc,#16a34a);
           background:#fffd; font:900 22px/1 var(--font); letter-spacing:.06em; padding:6px 12px; border-radius:8px; text-transform:uppercase;
           transition:.4s; mix-blend-mode:normal; }
  .stamp.bad { animation:stampIn .35s cubic-bezier(.2,2,.4,1) }
  @keyframes stampIn { from { transform:rotate(12deg) scale(2.4); opacity:0 } }

  .talk { display:grid; gap:14px; justify-items:start; min-width:0 }
  .mascot { width:170px; height:auto; overflow:visible; filter:drop-shadow(0 8px 14px #0004); }
  .mascot .pupil { transition:transform .35s cubic-bezier(.3,1.6,.5,1) }
  .mascot .brow { transform-box:fill-box; transform-origin:center; transition:transform .35s }
  .mascot.idle .pupil { animation:look 6s ease-in-out infinite }
  @keyframes look { 0%,100% { transform:translate(0,-1px) } 30% { transform:translate(6px,0) } 65% { transform:translate(-6px,1px) } }
  .mascot.blink .lid { animation:blink 4s infinite }
  @keyframes blink { 0%,94%,100% { transform:scaleY(0) } 97% { transform:scaleY(1) } }
  .lid { transform-box:fill-box; transform-origin:top; transform:scaleY(0) }

  .bubble { position:relative; background:#fff; color:#17171a; border-radius:26px; padding:20px 26px; max-width:100%; min-width:min(100%,320px);
            box-shadow:0 14px 34px #0004; }
  .bubble::before { content:""; position:absolute; top:-14px; left:60px; border:14px solid transparent; border-top:0; border-bottom-color:#fff }
  .bubble.pop { animation:pop .35s cubic-bezier(.2,1.8,.4,1) }
  @keyframes pop { from { transform:scale(.85) rotate(-1.5deg); opacity:.3 } }
  #line { margin:0; font:800 36px/1.18 var(--font); letter-spacing:-.02em; overflow-wrap:anywhere; min-height:1.2em }
  #line.caret::after { content:"▍"; animation:caret .7s steps(1) infinite; color:var(--c1) }
  @keyframes caret { 50% { opacity:0 } }
  .glitch #line { text-shadow:2px 0 #ff2d55, -2px 0 #00e5ff; animation:glitch 1.2s infinite }
  @keyframes glitch { 0%,90%,100% { transform:none } 92% { transform:translate(3px,-2px) skewX(-6deg) } 95% { transform:translate(-3px,2px) } }
  .bmeta { margin-top:10px; font-size:13px; font-weight:700; color:#6b6b72; text-transform:uppercase; letter-spacing:.06em }

  .hud { display:flex; gap:22px; align-items:center; flex-wrap:wrap }
  .clock b { display:block; font:800 54px/1 ui-monospace,"SF Mono",monospace; letter-spacing:-.04em; text-shadow:0 4px 18px #0004 }
  .clock span { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; opacity:.85 }
  .pips { display:flex; gap:6px }
  .pips i { width:30px; height:12px; border-radius:6px; background:#fff4; transition:.3s }
  .pips i.on { background:#fff; box-shadow:0 0 14px #fff9 }
  .lvname { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-top:6px; opacity:.9 }
  .rain { position:absolute; top:-40px; font-size:28px; pointer-events:none; animation:fall linear forwards; z-index:0 }
  @keyframes fall { to { transform:translateY(640px) rotate(360deg); opacity:.3 } }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:50 }

  /* ---------- cards ---------- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px }
  .kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:10px }
  @media (max-width: 860px) { .kpis { grid-template-columns:repeat(2,1fr) } .two { grid-template-columns:1fr !important } }
  .m { border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--card) }
  .m b { display:block; font-size:24px; font-variant-numeric:tabular-nums; letter-spacing:-.02em }
  .m span { color:var(--mute); font-size:12px }
  .hint { color:var(--mute); font-size:12px }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px }
  canvas.ch { width:100%; height:140px; display:block }
  .sec-h { display:flex; align-items:baseline; gap:10px; margin-bottom:10px }
  .sec-h b { font-size:16px }
  .shame { display:grid; gap:8px }
  .shame button { display:flex; gap:12px; align-items:center; text-align:left; border-radius:14px; padding:12px 14px; width:100% }
  .shame .lv { font:800 12px var(--font); color:#fff; border-radius:8px; padding:3px 8px; flex:none }
  .shame .tx { flex:1; font-weight:600 }
  .shame .sh { opacity:.5; flex:none }
  details.sig > summary { cursor:pointer; font-weight:700; padding:2px 0 }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden }
  .bar i { display:block; height:100%; background:var(--acc) }
  .legend { display:flex; gap:12px; font-size:12px; color:var(--mute); margin:12px 0 4px; flex-wrap:wrap }
  .legend i { display:inline-block; width:10px; height:3px; vertical-align:middle; margin-right:4px }
  ul { list-style:none; padding:0; margin:0; font-size:14px; max-height:160px; overflow:auto }
  li { padding:4px 0; border-bottom:1px solid var(--line) }
  #chart { width:100%; height:110px; display:block }

  /* ---------- modal + toast ---------- */
  #modal { position:fixed; inset:0; background:#000c; display:none; place-items:center; z-index:100; padding:16px }
  #modal.on { display:grid }
  #modal .box { background:var(--card); border-radius:20px; padding:16px; display:grid; gap:12px; max-height:96vh; justify-items:center }
  #modal img { max-height:72vh; max-width:100%; border-radius:12px; box-shadow:0 10px 40px #0008 }
  #modal .acts { display:flex; gap:8px; flex-wrap:wrap; justify-content:center }
  #modal .acts .primary { background:var(--fg); color:var(--bg) }
  #toast { position:fixed; bottom:22px; left:50%; transform:translate(-50%,80px); background:#111; color:#fff; padding:10px 18px; border-radius:99px;
           font-weight:700; transition:.35s; z-index:90; box-shadow:0 8px 30px #0006 }
  #toast.on { transform:translate(-50%,0) }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
  <header>
    <img src="/logo.svg" alt="" class="logo"><h1>on-duty</h1><span class="pill" id="pill">…</span><span class="sp"></span>
    <button id="blur" data-i="blur"></button><button id="test" data-i="test"></button>
    <span class="menuwrap"><button id="pause"></button><div class="menu" id="pmenu"><button data-m="60" data-i="p1h"></button><button data-m="tomorrow" data-i="ptom"></button></div></span>
    <a href="/setup?edit" class="gear" title="Settings" aria-label="Settings">⚙</a><button id="photo" data-i="photo"></button>
  </header>

  <section class="stage" id="stage">
    <div class="polaroid" id="polaroid">
      <img id="cam" alt=""><div class="zz">💤</div>
      <div class="stamp" id="stamp"></div>
      <div class="cap"><span id="capName"></span><span id="capTime"></span></div>
    </div>
    <div class="talk">
      <svg class="mascot idle blink" id="mascot" viewBox="0 -40 200 170" aria-hidden="true">
        <defs><clipPath id="clipL"><ellipse cx="60" cy="62" rx="34" ry="30"/></clipPath><clipPath id="clipR"><ellipse cx="140" cy="62" rx="34" ry="30"/></clipPath></defs>
        <ellipse cx="60" cy="62" rx="34" ry="30" fill="#fff"/><ellipse cx="140" cy="62" rx="34" ry="30" fill="#fff"/>
        <g class="pupil" id="pupL"><circle cx="60" cy="62" r="14" fill="#18181b"/><circle cx="55" cy="56" r="4.5" fill="#fff"/></g>
        <g class="pupil" id="pupR"><circle cx="140" cy="62" r="14" fill="#18181b"/><circle cx="135" cy="56" r="4.5" fill="#fff"/></g>
        <g clip-path="url(#clipL)"><rect class="lid" x="20" y="30" width="80" height="64" fill="#18181b"/></g>
        <g clip-path="url(#clipR)"><rect class="lid" x="100" y="30" width="80" height="64" fill="#18181b"/></g>
        <rect class="brow" id="browL" x="28" y="18" width="58" height="9" rx="4.5" fill="#18181b"/>
        <rect class="brow" id="browR" x="114" y="18" width="58" height="9" rx="4.5" fill="#18181b"/>
        <path id="mouth" d="M75 112 Q100 124 125 112" fill="none" stroke="#18181b" stroke-width="7" stroke-linecap="round"/>
<path d="M42 8 C42 -22 70 -36 100 -36 C130 -36 158 -22 158 8 Z" fill="#0f172a"/><rect x="22" y="3" width="156" height="11" rx="5.5" fill="#0a0f1d"/><path d="M100 -27 l4.2 8.6 9.4 1.3 -6.8 6.6 1.6 9.4 -8.4 -4.4 -8.4 4.4 1.6 -9.4 -6.8 -6.6 9.4 -1.3Z" fill="#facc15"/>
      </svg>
      <div class="bubble" id="bubble"><p id="line"></p><div class="bmeta" id="lmeta"></div></div>
      <div class="hud">
        <div class="clock"><span id="clockLbl"></span><b id="clock">0:00</b></div>
        <div><div class="pips" id="pips"><i></i><i></i><i></i><i></i><i></i></div><div class="lvname" id="lvname"></div></div>
      </div>
    </div>
  </section>

  <section class="kpis">
    <div class="m"><span data-i="k_streak"></span><b id="k-streak">–</b></div>
    <div class="m"><span data-i="k_min"></span><b id="k-min">–</b></div>
    <div class="m"><span data-i="k_n"></span><b id="k-n">–</b></div>
    <div class="m"><span data-i="k_al"></span><b id="k-al">–</b></div>
    <div class="m"><span data-i="k_max"></span><b id="k-max">–</b></div>
    <div class="m"><span data-i="k_wk"></span><b id="k-wk">–</b></div>
  </section>

  <section class="card">
    <div class="sec-h"><b data-i="shame"></b><span class="hint" data-i="shame_sub"></span></div>
    <div class="shame" id="shame"></div>
  </section>

  <section class="card two">
    <div><div class="hint" data-i="byhour"></div><canvas class="ch" id="byhour"></canvas></div>
    <div><div class="hint" data-i="byday"></div><canvas class="ch" id="byday"></canvas></div>
  </section>

  <details class="card sig" id="sig">
    <summary data-i="signals"></summary>
    <div class="grid">
      <div class="m"><span data-i="head"></span><b id="dp">–</b><span id="dpt"></span></div>
      <div class="m"><span data-i="gaze"></span><b id="gz">–</b><span id="gzt"></span></div>
      <div class="m"><span data-i="downwin"></span><b id="dr">–</b><div class="bar"><i id="drb"></i></div></div>
      <div class="m"><span data-i="idlelbl"></span><b id="idle">–</b><div class="bar"><i id="idleb"></i></div></div>
      <div class="m" style="grid-column:1/-1"><span data-i="phonelbl"></span><b id="ph">–</b><span id="pht"></span></div>
    </div>
    <div class="hint" id="calib" style="margin-top:8px"></div>
    <div class="legend"><span><i style="background:var(--acc)"></i><t data-i="lg_head"></t></span><span><i style="background:var(--warn)"></i><t data-i="lg_gaze"></t></span><span><i style="background:var(--bad);height:8px;opacity:.25"></i><t data-i="lg_down"></t></span><span><i style="background:var(--bad);height:8px;width:8px;border-radius:4px"></i><t data-i="lg_phone"></t></span></div>
    <canvas id="chart"></canvas>
    <div class="hint" data-i="chart_hint"></div>
    <div style="margin-top:12px"><b data-i="events"></b><ul id="ev"></ul></div>
  </details>
</main>

<div id="modal"><div class="box"><img id="shot" alt=""><div class="acts">
  <button class="primary" id="dl" data-i="download"></button><button id="cp" data-i="copy"></button><button id="sh" data-i="share"></button><button id="close" data-i="close"></button>
</div></div></div>
<div id="toast"></div>

<script>

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (v, d=1) => v == null ? '–' : (v > 0 ? '+' : '') + v.toFixed(d);
const PAL = [  // 0 = back, 1..5 = nag level
  ['#0f766e', '#22c55e'], ['#d97706', '#f59e0b'], ['#ea580c', '#f97316'], ['#dc2626', '#f43f5e'], ['#9d174d', '#7e22ce'], ['#111113', '#e11d48']];
const SLEEP = ['#1e1b4b', '#3730a3'], WORK = ['#0f766e', '#2563eb'], WATCH = ['#b45309', '#f59e0b'], CALIB = ['#334155', '#64748b'], AWAY = ['#3f3f46', '#71717a'];

const STR = {

    byhour:'minutos no celular por hora · hoje', byday:'minutos no celular por dia · 14 dias',
    connecting:'conectando…', offline:'serviço fora do ar', offline_pill:'offline',

    stamp_sleep:'DORMINDO', stamp_off:'FORA DO EXPEDIENTE', stamp_pause:'PAUSADO', clock_back:'volto em', pill_asleep:'dormindo', pill_off:'fora do expediente', pill_paused:'pausado', pill_away:'ausente',
